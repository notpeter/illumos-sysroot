name: OmniOS archive

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full-gate-build:
        description: Build illumos-gate and assemble the sysroot from repo.redist
        required: false
        type: boolean
        default: false

jobs:
  release-locks:
    runs-on: ubuntu-latest
    name: Verify locked profile (${{ matrix.release }})
    strategy:
      fail-fast: false
      matrix:
        release:
          - '20181213'
          - '20210501'
          - '20231226'
    steps:
      - uses: actions/checkout@v7

      - name: Verify profile against durable lock
        run: scripts/validate-release-lock.sh "${{ matrix.release }}"

  archive:
    runs-on: ubuntu-latest
    name: Installed-package smoke on OmniOS r151046
    steps:
      - uses: actions/checkout@v7

      - name: Build archive in OmniOS
        # v1.3.2 is the newest release whose image set includes r151046.
        uses: vmactions/omnios-vm@d42d894b41dd58cf7e31c194709a1c0fe3d04ace # v1.3.2
        with:
          release: r151046
          prepare: |
            pkg publisher extra.omnios >/dev/null 2>&1 || \
              pkg set-publisher -g https://pkg.omnios.org/r151046/extra extra.omnios
            pkg refresh extra.omnios
            pkg install --accept \
              developer/build/gnu-make \
              developer/gcc10 \
              ooce/developer/rust
          run: |
            set -eu
            export PATH=/opt/ooce/bin:/opt/gcc-10/bin:$PATH

            repo="$PWD/.sysroot-ci/repo"
            pkgroot=$(RELEASE=20231226 scripts/receive-installed-packages.sh "$repo")

            gmake archive RELEASE=20231226 ILLUMOS_PKGREPO="$pkgroot"

            archive=output/illumos-sysroot-i386-20231226-ae676b1204fb-v1.tar.gz
            test -s "$archive"
            gzip -dc "$archive" | tar tf - > output/tar.list

            grep -Eq '^usr/include/?$' output/tar.list
            grep -Eq '^usr/lib/libgcc_s\.so\.1( |$)' output/tar.list
            grep -Eq '^usr/lib/amd64/libgcc_s\.so\.1( |$)' output/tar.list
            grep -Eq '^usr/lib/libssp\.so\.0\.0\.0( |$)' output/tar.list
            grep -Eq '^usr/lib/amd64/libssp\.so\.0\.0\.0( |$)' output/tar.list
            ! grep -Eq '^(usr/bin|etc|var|bin|sbin|usr/sbin|usr/share|usr/ccs)(/|$)' output/tar.list

            pvs -dsv shims/libgcc_s/i386/libgcc_s.so.1 | grep GCC_4.8.0
            pvs -dsv shims/libgcc_s/amd64/libgcc_s.so.1 | grep GCC_4.8.0

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: illumos-sysroot-20231226-smoke
          path: |
            output/illumos-sysroot-i386-20231226-ae676b1204fb-v1.tar.gz
            output/tar.list

  build-env:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.full-gate-build }}
    name: Recreate locked r151046 gate kit
    steps:
      - uses: actions/checkout@v7

      - name: Archive build packages in OmniOS
        # v1.3.2 is the newest release whose image set includes r151046.
        uses: vmactions/omnios-vm@d42d894b41dd58cf7e31c194709a1c0fe3d04ace # v1.3.2
        with:
          release: r151046
          run: |
            set -eu
            set -- $(nawk -F '\t' \
              '$1 == "requested_fmri" { print $2 }' \
              locks/toolchain.20231226.lock)
            OMNIOS_ARCHIVE_WORKDIR="$PWD/.sysroot-ci/work" \
            OMNIOS_TOOLCHAIN_CLOSURE_LOCK="$PWD/locks/toolchain.20231226.lock" \
              scripts/archive-omnios-build-env.sh -r 20231226 \
              .sysroot-ci/build-env "$@"
            cmp locks/toolchain.20231226.lock \
              .sysroot-ci/build-env/toolchain.20231226.lock

      - name: Upload build package archives
        uses: actions/upload-artifact@v4
        with:
          name: omnios-r151046-build-env
          path: .sysroot-ci/build-env/

  full-gate-build:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.full-gate-build }}
    needs: build-env
    name: Build illumos-gate sysroot on OmniOS r151046
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      - name: Download build package archives
        uses: actions/download-artifact@v4
        with:
          name: omnios-r151046-build-env
          path: .sysroot-ci/build-env

      - name: Build illumos-gate and archive in OmniOS
        # v1.3.2 is the newest release whose image set includes r151046.
        uses: vmactions/omnios-vm@d42d894b41dd58cf7e31c194709a1c0fe3d04ace # v1.3.2
        with:
          release: r151046
          sync: rsync
          prepare: |
            envdir="$GITHUB_WORKSPACE/.sysroot-ci/build-env"
            OMNIOS_TOOLCHAIN_DENY_NEW_BE=1 \
              scripts/install-omnios-toolchain.sh "$envdir"
          run: |
            set -eu
            OMNIOS_TOOLCHAIN_DIR="$PWD/.sysroot-ci/build-env" \
            ILLUMOS_SYSROOT_REQUIRE_LOCKED_TOOLCHAIN=1 \
            ILLUMOS_SYSROOT_GATE_ONLY=1 \
              scripts/build-omnios-sysroot.sh -r 20231226 \
              -w "$PWD/.sysroot-ci/gate-work" -j 4

            # Rust is introduced only after the locked gate output exists.
            pkg set-publisher -g https://pkg.omnios.org/r151046/core omnios
            pkg set-publisher -g https://pkg.omnios.org/r151046/extra \
              extra.omnios
            pkg install --accept ooce/developer/rust
            gmake archive RELEASE=20231226 \
              ILLUMOS_PKGREPO="$PWD/.sysroot-ci/gate-work/illumos-gate/packages/i386/nightly-nd/repo.redist"

      - name: Upload full build archive
        uses: actions/upload-artifact@v4
        with:
          name: illumos-sysroot-20231226-full
          path: |
            output/illumos-sysroot-i386-20231226-ae676b1204fb-v1.tar.gz
            output/illumos-sysroot-i386-20231226-ae676b1204fb-v1.tar.gz.sha256
            output/tar.list
            .sysroot-ci/build-env/
