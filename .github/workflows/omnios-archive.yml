name: OmniOS archive

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full-gate-build:
        description: Build illumos-gate and assemble the sysroot from repo.redist
        required: false
        type: boolean
        default: false

jobs:
  archive:
    runs-on: ubuntu-latest
    name: Assemble sysroot on OmniOS r151046
    steps:
      - uses: actions/checkout@v7

      - name: Build archive in OmniOS
        uses: vmactions/omnios-vm@027e3ec08fed6fb740ab5f300c2605f9de02997a # v1.3.4
        with:
          release: r151046
          cache-after-prepare: true
          prepare: |
            pkg publisher extra.omnios >/dev/null 2>&1 || \
              pkg set-publisher -g https://pkg.omnios.org/r151046/extra extra.omnios
            pkg refresh extra.omnios
            pkg install --accept \
              developer/build/gnu-make \
              developer/gcc10 \
              ooce/developer/rust
          run: |
            set -eu
            export PATH=/opt/ooce/bin:/opt/gcc-10/bin:$PATH

            repo="$PWD/.sysroot-ci/repo"
            pkgroot=$(RELEASE=20231226 scripts/receive-installed-packages.sh "$repo")

            gmake archive RELEASE=20231226 ILLUMOS_PKGREPO="$pkgroot"

            archive=output/illumos-sysroot-i386-20231226-ae676b1204fb-v1.tar.gz
            test -s "$archive"
            gzip -dc "$archive" | tar tf - > output/tar.list

            grep -Eq '^usr/include/?$' output/tar.list
            grep -Eq '^usr/lib/libgcc_s\.so\.1( |$)' output/tar.list
            grep -Eq '^usr/lib/amd64/libgcc_s\.so\.1( |$)' output/tar.list
            grep -Eq '^usr/lib/libssp\.so\.0\.0\.0( |$)' output/tar.list
            grep -Eq '^usr/lib/amd64/libssp\.so\.0\.0\.0( |$)' output/tar.list
            ! grep -Eq '^(usr/bin|etc|var|bin|sbin|usr/sbin|usr/share|usr/ccs)(/|$)' output/tar.list

            pvs -dsv shims/libgcc_s/i386/libgcc_s.so.1 | grep GCC_4.8.0
            pvs -dsv shims/libgcc_s/amd64/libgcc_s.so.1 | grep GCC_4.8.0

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: illumos-sysroot-20231226-smoke
          path: |
            output/illumos-sysroot-i386-20231226-ae676b1204fb-v1.tar.gz
            output/tar.list

  build-env:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.full-gate-build }}
    name: Preserve OmniOS build packages
    steps:
      - uses: actions/checkout@v7

      - name: Archive build packages in OmniOS
        uses: vmactions/omnios-vm@027e3ec08fed6fb740ab5f300c2605f9de02997a # v1.3.4
        with:
          release: r151046
          cache-after-prepare: true
          run: |
            set -eu
            scripts/archive-omnios-build-env.sh .sysroot-ci/build-env \
              developer/build/onbld \
              developer/gcc10 \
              developer/build/gnu-make \
              developer/illumos-tools \
              runtime/java/openjdk11 \
              developer/versioning/git \
              ooce/developer/rust

      - name: Upload build package archives
        uses: actions/upload-artifact@v4
        with:
          name: omnios-r151046-build-env
          path: .sysroot-ci/build-env/

  full-gate-build:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.full-gate-build }}
    needs: build-env
    name: Build illumos-gate sysroot on OmniOS r151046
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      - name: Download build package archives
        uses: actions/download-artifact@v4
        with:
          name: omnios-r151046-build-env
          path: .sysroot-ci/build-env

      - name: Build illumos-gate and archive in OmniOS
        uses: vmactions/omnios-vm@027e3ec08fed6fb740ab5f300c2605f9de02997a # v1.3.4
        with:
          release: r151046
          sync: rsync
          cache-after-prepare: true
          prepare: |
            envdir="$GITHUB_WORKSPACE/.sysroot-ci/build-env"
            core="$envdir/omnios-r151046-core.p5p"
            extra="$envdir/omnios-r151046-extra.p5p"

            test -s "$core"
            test -s "$extra"
            pkg set-publisher -G '*' -M '*' omnios
            if pkg publisher extra.omnios >/dev/null 2>&1; then
              pkg set-publisher -G '*' -M '*' extra.omnios
            fi
            set +e
            xargs pkg install --accept --no-refresh -g "$core" -g "$extra" \
              < "$envdir/install.fmris"
            status=$?
            set -e
            if [ "$status" -ne 0 ] && [ "$status" -ne 4 ]; then
              exit "$status"
            fi
            pkg list -Hv $(cat "$envdir/requested-packages.txt") | \
              awk '{ print $1 }' | sort > "$envdir/requested-installed.fmris"
            diff -u "$envdir/requested.fmris" "$envdir/requested-installed.fmris"
          run: |
            set -eu
            scripts/build-omnios-sysroot.sh -r 20231226 -w /tmp/illumos-sysroot-build -j 4

      - name: Upload full build archive
        uses: actions/upload-artifact@v4
        with:
          name: illumos-sysroot-20231226-full
          path: |
            output/illumos-sysroot-i386-20231226-ae676b1204fb-v1.tar.gz
            output/illumos-sysroot-i386-20231226-ae676b1204fb-v1.tar.gz.sha256
            output/tar.list
            .sysroot-ci/build-env/
